name: SAMUDRA-3D CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Python 3.11 & Tests)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///backend/data/samudra_test.db
      SAMUDRA_DATA_ROOT: ${{ github.workspace }}/SAMUDRA_DATA

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for NetCDF & HDF5
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libnetcdf-dev libhdf5-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install sqlalchemy alembic "psycopg[binary]" pydantic

      - name: Create Test Data Directories
        run: |
          mkdir -p backend/data
          mkdir -p SAMUDRA_DATA/raw SAMUDRA_DATA/processed SAMUDRA_DATA/cache SAMUDRA_DATA/indexes SAMUDRA_DATA/manifests SAMUDRA_DATA/demo

      - name: Run Backend Unit & Integration Tests
        run: |
          python -m unittest discover backend/tests -v

  frontend-ci:
    name: Frontend CI (Node.js 20, Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify ESLint / Static Analysis
        working-directory: ./frontend
        run: npm run lint

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

  deployment-validation:
    name: Vercel & Dockerfile Configuration Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate vercel.json Syntax
        run: |
          python -c "import json; json.load(open('vercel.json'))"
          python -c "import json; json.load(open('frontend/vercel.json'))"

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
